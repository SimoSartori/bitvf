# A box run of bitvf: optimal-transport reconstruction of halos observed in
# redshift space, correction of the redshift-space distortions, a second
# reconstruction in real space, and the void search on both passes. The run of
# the full_recons_box example, which writes the same voids_box.dat. Run from
# the repository root:
#
#   bitvf examples/executable/box.ini
#
# Syntax: one "key = value" per line, "#" starts a comment. Every key that
# applies to this run is listed below; where the run needs another value than
# the library's default, the default is in the comment. A key left out of a
# file takes the default. "key =" (no value) means "none", as leaving the key
# out. Keys without a default (the paths, the columns, the output name, and
# the correction's cosmology, redshift, bias, axis and width) must be set. A
# key that does not apply to the run is an error, so the commented-out lines
# must stay so unless their switch is set. Every key is described at
# https://simosartori.github.io/bitvf/box/executable.html

geometry = box
verbosity = detailed                # silent, normal or detailed; default normal

# ---------------------------------------------------------------------------
# Input: the tracers, in coordinate units (here Mpc/h)
# ---------------------------------------------------------------------------

tracer_file = examples/data/box_halos_redshift_space.dat
column_tracer = 0 1 2               # x, y, z: 0-based indices in ASCII, names in FITS
id_column =                         # integer identity of each tracer; none: the row
delimiter = " "
comment = "#"

# Randoms for the reconstruction. None: bitvf draws Nrec times as many as there
# are tracers, uniformly in the box, from a seed derived from seed.
random_file =
# column_random = 0 1 2             # required when random_file is set

# ---------------------------------------------------------------------------
# Reconstruction (otswap), for both passes
# ---------------------------------------------------------------------------

Nrec = 8                            # realizations; default 30
threshold = 1e-2                    # convergence; default 1e-3
seed = 12345                        # 0, the default: drawn, and recorded in the files
mesh_cellsize = 4                   # neighbour-search cell, in mps: speed only
box_min = 269 269 269               # the box, three values each; none, the default:
box_max = 669 669 669               #   the bounding box of the tracers (and randoms)
mps =                               # mean particle separation; none: otswap's

# ---------------------------------------------------------------------------
# Void finder, on both passes
# ---------------------------------------------------------------------------

sigma = 1                           # Gaussian smoothing width; 0 for none
sigma_unit = mps                    # mps or coordinate
cell_size =                         # divergence cell, in mps; none: min(1, cbrt(20 / Nrec))

# ---------------------------------------------------------------------------
# Correction of redshift-space distortions: with perform_recons = true the
# tracers are taken as redshift-space positions, corrected, reconstructed again
# and searched in real space. The keys below apply only then; those marked
# "no default" must be chosen.
# ---------------------------------------------------------------------------

perform_recons = true               # default false
Omega_matter = 0.3186               # no default
little_h = 0.67                     # no default
w0 = -1
wa = 0
redshift = 1                        # of the box; no default
bias = 1.91255                      # linear bias of the tracers; no default
los_axis = 1                        # line of sight: 0, 1 or 2 for x, y or z; no default
rsd_smoothing_scale = 10            # in coordinate units, 0 for none; no default
rsd_weight_by_realizations = false
save_zspace_voids = true            # also search the redshift-space pass; default false
printRecCat = false                 # the corrected catalogue

# ---------------------------------------------------------------------------
# Starting from files instead of the tracers (at most one of the three; each
# makes the reconstruction, randoms and correction keys errors).
# With displacement_file or displacement_mean_file, tracer_file, column_tracer,
# id_column, delimiter and comment are errors too, and cell_size is an error
# when divergence_file is set; sigma, sigma_unit, divergence_file, cell_size
# and the output keys stay. With divergence_input_file, cell_size and
# divergence_file are errors, and tracer_file, column_tracer, id_column,
# delimiter and comment stay.
# ---------------------------------------------------------------------------

# displacement_file = displacement_complete_box.fits       # otswap's printDisplComplete
# displacement_mean_file = displacement_mean_box.fits      # otswap's printDisplMean
# divergence_input_file = divergence_box.fits              # bitvf's printDiv; needs
#                                                          #   tracer_file
# divergence_file =                 # with the first two: a divergence file whose grid is reused

# ---------------------------------------------------------------------------
# Output: voids_<output_file> is always written; with save_zspace_voids, the
# redshift-space pass writes the same files with zspace_ in their names
# ---------------------------------------------------------------------------

output_dir = examples/executable/output
output_file = box
output_format = dat                 # dat (ASCII) or fits
printDisplMean = false              # otswap's mean displacements
printDisplComplete = false          # otswap's complete displacements
printDiv = true                     # divergence_<output_file>; default false
printGal = false                    # galaxies_<output_file>: where each tracer ended up
printOverdense = false              # overdense_basins_<output_file>
