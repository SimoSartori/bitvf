# A lightcone run of bitvf: optimal-transport reconstruction of tracers observed
# in redshift space on a part of the sky, correction of the redshift-space
# distortions, a second reconstruction in real space, and the void search on
# both passes. Run from the repository root:
#
#   bitvf examples/executable/lightcone.ini
#
# Syntax: one "key = value" per line, "#" starts a comment. Every key that
# applies to this run is listed below; where the run needs another value than
# the library's default, the default is in the comment. A key left out of a
# file takes the default. "key =" (no value) means "none", as leaving the key
# out. Keys without a default (the paths, the columns, the units, the number of
# bins, the cosmology, the output name, and the correction's bias table and
# width) must be set. A key that does not apply to the run is an error, so the
# commented-out lines must stay so unless their switch is set. Every key is
# described at https://simosartori.github.io/bitvf/executable.html

geometry = lightcone
verbosity = detailed                # silent, normal or detailed; default normal

# ---------------------------------------------------------------------------
# Input: the tracers and the randoms, as RA, Dec and the observed redshift
# ---------------------------------------------------------------------------

tracer_file = examples/data/lightcone_tracers.dat
column_tracer = 0 1 2               # RA, Dec, z: 0-based indices in ASCII, names in FITS
id_column =                         # integer identity of each tracer; none: the row
delimiter = " "
comment = "#"
units = degrees                     # of RA and Dec in both files: degrees or radians; no default

# The randoms describe the survey: they must carry its footprint and redshift
# distribution, and every systematic belongs in them. At least Nrec times as
# many as the tracers are needed; 10 times is a good start.
random_file = examples/data/lightcone_randoms.dat
column_random = 0 1 2

# The footprint: a full-sky HEALPix map, 0 for an unobserved pixel, anything
# else observed; a gzip-compressed .fits.gz file is read as it is. Tracers on
# unobserved pixels keep their row and take no part.
veto_mask_filename = examples/data/lightcone_mask.fits.gz

# The closed redshift range of the run; a tracer outside keeps its row and
# takes no part, a random outside is removed. None: no cut.
z_min = 0.885
z_max = 1.10

# ---------------------------------------------------------------------------
# Cosmology: the redshift-distance table
# ---------------------------------------------------------------------------

Omega_matter = 0.286                # no default
little_h = 0.7                      # no default
w0 = -1
wa = 0

# ---------------------------------------------------------------------------
# Reconstruction (otswap), for both passes
# ---------------------------------------------------------------------------

Nrec = 8                            # realizations; default 30
threshold = 1e-2                    # convergence; default 1e-3
seed = 12345                        # 0, the default: drawn, and recorded in the files
mesh_cellsize = 4                   # neighbour-search cell, in mps: speed only
bins = 30                           # redshift bins of the mps(z) profile; no default.
                                    #   Each needs enough tracers: reduce it for a small sample
reject_mask_crossings = true        # reject a displacement that crosses unobserved pixels
max_unobserved_pixels_crossed = 0   # the longest run of them it may cross in a row

# ---------------------------------------------------------------------------
# Void finder, on both passes
# ---------------------------------------------------------------------------

sigma = 1                           # Gaussian smoothing width; 0 for none
sigma_unit = mps                    # mps or coordinate
cell_size =                         # divergence cell, in mps; none: min(1, cbrt(20 / Nrec))

# ---------------------------------------------------------------------------
# Correction of redshift-space distortions: with perform_recons = true the
# tracers are corrected in redshift, reconstructed again and searched in real
# space. The keys below apply only then; those marked "no default" must be
# chosen.
# ---------------------------------------------------------------------------

perform_recons = true               # default false
bias_file = examples/data/lightcone_bias.dat   # linear bias against redshift: z b; no default
rsd_smoothing_scale = 10            # in coordinate units (Mpc/h), 0 for none; no default
rsd_weight_by_realizations = false
# Randoms of the second reconstruction: resample gives them the redshift
# distribution of the corrected tracers; none keeps the observed one; external
# takes the file random_file_recons, with the columns of column_random.
random_recons_mode = resample       # none, resample or external; default resample
# random_file_recons = randoms_real_space.dat   # with external only
save_zspace_voids = true            # also search the redshift-space pass; default false
printRecCat = false                 # the corrected catalogue

# ---------------------------------------------------------------------------
# Starting from files instead of the tracers (at most one of the two; each
# makes the tracer, reconstruction and correction keys errors, and the file
# holds the redshift cut, the cosmology and the mps profile; random_file,
# units and veto_mask_filename stay required)
# ---------------------------------------------------------------------------

# displacement_file = displacement_complete_lightcone.fits   # otswap's printDisplComplete
# displacement_mean_file = displacement_mean_lightcone.fits  # otswap's printDisplMean
# divergence_file =                 # with either: a divergence file whose grid is reused

# ---------------------------------------------------------------------------
# Output: voids_<output_file> is always written; with save_zspace_voids, the
# redshift-space pass writes the same files with zspace_ in their names
# ---------------------------------------------------------------------------

output_dir = examples/executable/output
output_file = lightcone
output_format = dat                 # dat (ASCII) or fits
printDisplMean = false              # otswap's mean displacements
printDisplComplete = false          # otswap's complete displacements
printMps = false                    # the mps(z) profile of each pass, MPS_[zspace_]<output_file>
printDiv = true                     # divergence_<output_file>; default false
printGal = false                    # galaxies_<output_file>: where each tracer ended up
printOverdense = false              # overdense_basins_<output_file>
