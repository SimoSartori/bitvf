name: Wheels

# Builds the wheels for CPython 3.10 to 3.14 on manylinux x86_64 and aarch64
# and on macOS arm64 and x86_64, and tests each one: the comparison tests
# against the C++ library, the determinism hashes, the README's code, and
# otswap and bitvf in one process. Run by hand from the Actions tab; the
# configuration is in pyproject.toml and tools/wheels/.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: wheelhouse

      # bitvf installs no C++ library, header, CMake file or example.
      - name: The wheels hold no C++ library, header, CMake file or example
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("wheelhouse/*.whl")
          bad = [f"{w}: {name}" for w in wheels for name in zipfile.ZipFile(w).namelist()
                 if name.endswith((".a", ".h", ".cmake")) or "examples/" in name]
          print(len(wheels), "wheels;", len(bad), "C++ library, header, CMake or example files")
          print("\n".join(bad))
          sys.exit(1 if bad or not wheels else 0)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl
