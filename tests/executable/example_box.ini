# A box run of bitvf: optimal-transport reconstruction of the tracers, then the
# void search on its displacements. Run from the repository root:
#
#   bitvf tests/executable/example_box.ini
#
# Syntax: one "key = value" per line, "#" starts a comment. Every key that
# applies to this run is listed below with the library's default as its value;
# a key left out of a file takes that same default. "key =" (no value) means
# "none", as leaving the key out. Keys without a default (the paths, the
# columns, the output name) must be set. A key that does not apply to the run
# is an error, so the commented-out lines must stay so unless their switch is
# set. Every key is described at
# https://simosartori.github.io/bitvf/executable.html

geometry = box
verbosity = normal                  # silent, normal or detailed

# ---------------------------------------------------------------------------
# Input: the tracers, in coordinate units (e.g. Mpc/h)
# ---------------------------------------------------------------------------

tracer_file = tests/executable/data/box_tracers.dat
column_tracer = 0 1 2               # x, y, z: 0-based indices in ASCII, names in FITS
id_column =                         # integer identity of each tracer; none: the row
delimiter = " "
comment = "#"

# Randoms for the reconstruction. None: bitvf draws Nrec times as many as there
# are tracers, uniformly in the box, from seed.
random_file =
# column_random = 0 1 2             # required when random_file is set

# ---------------------------------------------------------------------------
# Reconstruction (otswap)
# ---------------------------------------------------------------------------

Nrec = 30                           # realizations
threshold = 1e-3                    # convergence
seed = 0                            # 0: drawn, and recorded in the files; set it to repeat a run
mesh_cellsize = 4                   # neighbour-search cell, in mps: speed only
box_min =                           # the box, three values each; none: the bounding
box_max =                           #   box of the tracers (and of the randoms, when given)
mps =                               # mean particle separation; none: otswap's

# ---------------------------------------------------------------------------
# Void finder
# ---------------------------------------------------------------------------

sigma = 1                           # Gaussian smoothing width; 0 for none
sigma_unit = mps                    # mps or coordinate
cell_size =                         # divergence cell, in mps; none: min(1, cbrt(20 / Nrec))

# ---------------------------------------------------------------------------
# Correction of redshift-space distortions: with perform_recons = true the
# tracers are taken as redshift-space positions, corrected, reconstructed again
# and searched in real space. The keys below apply only then; those marked
# "no default" must be chosen.
# ---------------------------------------------------------------------------

perform_recons = false
# Omega_matter = 0.3                # no default
# little_h = 0.7                    # no default
# w0 = -1
# wa = 0
# redshift = 0.5                    # of the box; no default
# bias = 1.5                        # linear bias of the tracers; no default
# los_axis = 2                      # line of sight: 0, 1 or 2 for x, y or z; no default
# rsd_smoothing_scale = 10          # in coordinate units, 0 for none; no default
# rsd_weight_by_realizations = false
# save_zspace_voids = false         # also search the redshift-space pass
# printRecCat = false               # the corrected catalogue

# ---------------------------------------------------------------------------
# Starting from files instead of the tracers (at most one of the three; each
# makes the reconstruction, randoms and correction keys errors)
# ---------------------------------------------------------------------------

# displacement_file = displacement_complete_box.fits       # otswap's printDisplComplete
# displacement_mean_file = displacement_mean_box.fits      # otswap's printDisplMean
# divergence_input_file = divergence_box.fits              # bitvf's printDiv with
#                                                          #   printDivUnsmoothed; needs
#                                                          #   tracer_file
# divergence_file =                 # with the first two: a divergence file whose grid is reused

# ---------------------------------------------------------------------------
# Output: voids_<output_file> is always written
# ---------------------------------------------------------------------------

output_dir = build-executable-examples
output_file = box
output_format = dat                 # dat (ASCII) or fits
printDisplMean = false              # otswap's mean displacements
printDisplComplete = false          # otswap's complete displacements
printDiv = false                    # divergence_<output_file>
# printDivUnsmoothed = false        # adds the field before smoothing; with printDiv = true
printGal = false                    # galaxies_<output_file>: where each tracer ended up
printOverdense = false              # overdense_basins_<output_file>
