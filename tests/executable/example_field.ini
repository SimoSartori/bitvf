# A run of bitvf-field: voids of a field given at the centres of the cells of a
# box lattice, with no tracers. The field is smoothed (sigma > 0), split into
# basins at 0 (voids where it is below 0) and catalogued. Run from the
# repository root:
#
#   bitvf-field tests/executable/example_field.ini
#
# Syntax as bitvf's parameter files. Every key that applies is listed below
# with the library's default as its value, except sigma_unit (see Smoothing);
# a key left out of a file takes the default. "key =" (no value) means "none",
# as leaving the key out. Every key is described at
# https://simosartori.github.io/bitvf/executable.html

verbosity = normal                  # silent, normal or detailed

# ---------------------------------------------------------------------------
# Input: one row per cell, centres in coordinate units, any row order. The
# centres must form a lattice of cubic cells, one centre per node. A divergence
# file of bitvf is valid input (cellX cellY cellZ, divergenceUnsmoothed, weight).
# ---------------------------------------------------------------------------

field_file = tests/executable/data/field.dat
column_centre = x y z               # names, or 0-based indices in ASCII
column_value = value
column_weight =                     # smoothing weight per cell; none: uniform
delimiter = " "
comment = "#"

# ---------------------------------------------------------------------------
# Smoothing
#
# IMPORTANT: sigma is in mps by default (sigma = 1, sigma_unit = mps), and mps
# has no default. Without a value of mps the run stops with an error, so set
# one of:
#   - mps = <mean particle separation>, to keep sigma in mps;
#   - sigma_unit = coordinate, sigma in coordinate units (as below);
#   - sigma = 0, no smoothing.
# ---------------------------------------------------------------------------

mps =                               # mean particle separation, in coordinate units; none
sigma = 1                           # Gaussian width; 0 for none
sigma_unit = coordinate             # default mps, which needs a value of mps

# ---------------------------------------------------------------------------
# Output: voids_<output_file> is always written
# ---------------------------------------------------------------------------

output_dir = build-executable-examples
output_file = field
output_format = dat                 # dat (ASCII) or fits
printOverdense = false              # overdense_basins_<output_file>
printDiv = false                    # divergence_<output_file>: the field after smoothing
# printDivUnsmoothed = false        # adds the field before smoothing; with printDiv = true
