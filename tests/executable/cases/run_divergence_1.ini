# A run on a divergence file with the tracers and their IDs: the files of the library calls, byte for byte, on 1 thread.

geometry = box
verbosity = silent
divergence_input_file = @REFERENCE@/pipeline/divergence_box.fits
tracer_file = @TEST_DATA@/box_tracers.dat
column_tracer = x y z
id_column = id
sigma = 2
output_dir = out
output_file = box
printDiv = true
printGal = true
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 1
#! exit 0
#! listing out
#! file out/voids_box.dat
#! file out/overdense_basins_box.dat
#! file out/divergence_box.dat
#! file out/galaxies_box.dat
#! same out/voids_box.dat divergence/voids_box.dat
#! same out/overdense_basins_box.dat divergence/overdense_basins_box.dat
#! same out/divergence_box.dat divergence/divergence_box.dat
#! same out/galaxies_box.dat divergence/galaxies_box.dat
