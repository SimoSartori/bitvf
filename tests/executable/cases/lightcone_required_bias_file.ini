# A lightcone run with the correction and without a bias table.

geometry = lightcone
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers.dat
column_tracer = ra dec z
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
z_min = 0.26
z_max = 0.39
Omega_matter = 0.3
little_h = 0.7
Nrec = 2
seed = 5
bins = 1
cell_size = 0.5
output_dir = out
output_file = lightcone
perform_recons = true
rsd_smoothing_scale = 1

# Expected (tests/executable/run_case.cmake)
#! exit 1
#! stderr bitvf: error: lightcone_required_bias_file.ini: key 'bias_file' is missing
