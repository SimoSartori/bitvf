# A field run with weights, sigma in coordinate units: the files of the library calls, byte for byte, on 4 threads.

verbosity = normal
field_file = @TEST_DATA@/field.dat
column_centre = x y z
column_value = value
column_weight = weight
sigma_unit = coordinate
output_dir = out
output_file = box
printOverdense = true
printDiv = true

# Expected (tests/executable/run_case.cmake)
#! program bitvf-field
#! threads 4
#! exit 0
#! wrote bitvf-field: wrote out/voids_box.dat
#! wrote bitvf-field: wrote out/overdense_basins_box.dat
#! wrote bitvf-field: wrote out/divergence_box.dat
#! listing out
#! file out/voids_box.dat
#! file out/overdense_basins_box.dat
#! file out/divergence_box.dat
#! same out/voids_box.dat field/voids_box.dat
#! same out/overdense_basins_box.dat field/overdense_basins_box.dat
#! same out/divergence_box.dat field/divergence_box.dat
