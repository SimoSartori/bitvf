# A lightcone run without cosmology.

geometry = lightcone
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers.dat
column_tracer = ra dec z
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
z_min = 0.26
z_max = 0.39
little_h = 0.7
Nrec = 2
seed = 5
bins = 1
cell_size = 0.5
output_dir = out
output_file = lightcone

# Expected (tests/executable/run_case.cmake)
#! exit 1
#! stderr bitvf: error: lightcone_required_Omega_matter.ini: key 'Omega_matter' is missing
