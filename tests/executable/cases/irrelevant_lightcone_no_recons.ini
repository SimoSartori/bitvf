# The keys of the correction without perform_recons, and max_unobserved_pixels_crossed without reject_mask_crossings.

geometry = lightcone
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers.dat
column_tracer = ra dec z
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
z_min = 0.26
z_max = 0.39
Omega_matter = 0.3
little_h = 0.7
Nrec = 2
seed = 5
bins = 1
cell_size = 0.5
output_dir = out
output_file = lightcone
random_recons_mode = resample
random_file_recons = r.dat
save_zspace_voids = true
rsd_smoothing_scale = 1
rsd_weight_by_realizations = true
bias_file = b.dat
printRecCat = true
reject_mask_crossings = false
max_unobserved_pixels_crossed = 1

# Expected (tests/executable/run_case.cmake)
