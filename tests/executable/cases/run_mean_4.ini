# A run on a mean displacement file, own grid of cell 1.2 mps, sigma in coordinate units, FITS: the files of the library calls, byte for byte, on 4 threads.

geometry = box
verbosity = silent
displacement_mean_file = @REFERENCE@/pipeline/displacement_mean_box.fits
divergence_file =
cell_size = 1.2
sigma = 3
sigma_unit = coordinate
output_dir = out
output_file = box
output_format = fits
printDiv = true
printGal = true
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 4
#! exit 0
#! listing out
#! file out/voids_box.fits
#! file out/overdense_basins_box.fits
#! file out/divergence_box.fits
#! file out/galaxies_box.fits
#! same out/voids_box.fits mean/voids_box.fits
#! same out/overdense_basins_box.fits mean/overdense_basins_box.fits
#! same out/divergence_box.fits mean/divergence_box.fits
#! same out/galaxies_box.fits mean/galaxies_box.fits
