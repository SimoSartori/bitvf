# A pipeline run with IDs and every output, FITS: the files of the library calls, byte for byte, on 1 thread.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_tracers.dat
column_tracer = x y z
id_column = id
Nrec = 2
seed = 5
output_dir = out
output_file = box
output_format = fits
printDisplMean = true
printDisplComplete = true
printDiv = true
printDivUnsmoothed = true
printGal = true
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 1
#! exit 0
#! listing out
#! file out/displacement_mean_box.fits
#! file out/displacement_complete_box.fits
#! file out/voids_box.fits
#! file out/overdense_basins_box.fits
#! file out/divergence_box.fits
#! file out/galaxies_box.fits
#! same out/displacement_mean_box.fits pipeline/displacement_mean_box.fits
#! same out/displacement_complete_box.fits pipeline/displacement_complete_box.fits
#! same out/voids_box.fits pipeline/voids_box.fits
#! same out/overdense_basins_box.fits pipeline/overdense_basins_box.fits
#! same out/divergence_box.fits pipeline/divergence_box.fits
#! same out/galaxies_box.fits pipeline/galaxies_box.fits
