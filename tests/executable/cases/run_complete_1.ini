# A run on a complete displacement file, reusing a divergence file's grid: the files of the library calls, byte for byte, on 1 thread.

geometry = box
verbosity = silent
displacement_file = @REFERENCE@/pipeline/displacement_complete_box.fits
divergence_file = @REFERENCE@/pipeline/divergence_box.fits
sigma = 0.5
output_dir = out
output_file = box
printDiv = true
printGal = true
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 1
#! exit 0
#! listing out
#! file out/voids_box.dat
#! file out/overdense_basins_box.dat
#! file out/divergence_box.dat
#! file out/galaxies_box.dat
#! same out/voids_box.dat complete/voids_box.dat
#! same out/overdense_basins_box.dat complete/overdense_basins_box.dat
#! same out/divergence_box.dat complete/divergence_box.dat
#! same out/galaxies_box.dat complete/galaxies_box.dat
