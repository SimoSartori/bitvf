# A pipeline run with the correction and the redshift-space voids, ASCII: the files of the library calls, byte for byte, in order, on 4 threads.

geometry = box
verbosity = normal
tracer_file = @TEST_DATA@/box_tracers.dat
column_tracer = x y z
Nrec = 2
seed = 9
perform_recons = true
Omega_matter = 0.3
little_h = 0.7
redshift = 0.5
bias = 1.5
los_axis = 2
rsd_smoothing_scale = 5
save_zspace_voids = true
output_dir = out
output_file = box
printDisplMean = true
printDiv = true
printGal = true
printOverdense = true
printRecCat = true

# Expected (tests/executable/run_case.cmake)
#! threads 4
#! exit 0
#! wrote bitvf: wrote out/displacement_mean_zspace_box.dat
#! wrote bitvf: wrote out/displacement_mean_box.dat
