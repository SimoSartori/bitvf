# Every pipeline key in a run with displacement_mean_file, the switches on.

geometry = box
verbosity = silent
displacement_mean_file = d.fits
output_dir = out
output_file = box
tracer_file = 1
column_tracer = 0 1 2
id_column = 3
random_file = 1
column_random = 0 1 2
delimiter = " "
comment = "#"
Omega_matter = 1
little_h = 1
w0 = 1
wa = 1
Nrec = 1
threshold = 1
seed = 1
mesh_cellsize = 1
box_min = 0 0 0
box_max = 1 1 1
mps = 1
perform_recons = true
save_zspace_voids = true
rsd_smoothing_scale = 1
rsd_weight_by_realizations = true
redshift = 1
bias = 1
los_axis = 1
printDisplMean = true
printDisplComplete = true
printRecCat = true

