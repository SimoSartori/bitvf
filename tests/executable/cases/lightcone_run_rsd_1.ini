# A lightcone run with the correction, resampled randoms and the redshift-space voids, every profile, ASCII: the files of the library calls, byte for byte, in order, on 1 thread.

geometry = lightcone
tracer_file = @TEST_DATA@/lightcone_tracers.dat
column_tracer = ra dec z
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
z_min = 0.26
z_max = 0.39
Omega_matter = 0.3
little_h = 0.7
Nrec = 2
seed = 9
bins = 1
cell_size = 0.5
output_dir = out
output_file = lightcone
verbosity = normal
perform_recons = true
rsd_smoothing_scale = 20
bias_file = @TEST_DATA@/lightcone_bias.dat
save_zspace_voids = true
printMps = true
printDiv = true
printGal = true
printOverdense = true
printRecCat = true

# Expected (tests/executable/run_case.cmake)
#! threads 1
#! exit 0
#! wrote bitvf: wrote out/MPS_zspace_lightcone.dat
#! wrote bitvf: wrote out/MPS_lightcone.dat
#! wrote bitvf: wrote out/reconstructed_catalogue_lightcone.dat
