# Every key of a lightcone only, in a box run; one with a broken value, not typed.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_tracers.dat
column_tracer = x y z
Nrec = 1
seed = 7
output_dir = out
output_file = box
units = 1
random_recons_mode = 1
random_file_recons = 1
veto_mask_filename = 1
z_min = 1
z_max = 1
bins = x
reject_mask_crossings = 1
max_unobserved_pixels_crossed = 1
bias_file = 1
printMps = 1

