# A lightcone run with IDs, the redshift cut and every output, FITS: the files of the library calls, byte for byte, on 4 threads.

geometry = lightcone
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers.dat
column_tracer = ra dec z
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
z_min = 0.26
z_max = 0.39
Omega_matter = 0.3
little_h = 0.7
Nrec = 2
seed = 5
bins = 1
cell_size = 0.5
output_dir = out
output_file = lightcone
id_column = id
output_format = fits
printDisplMean = true
printDisplComplete = true
printDiv = true
printGal = true
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 4
#! exit 0
#! listing out
#! file out/displacement_mean_lightcone.fits
#! file out/displacement_complete_lightcone.fits
#! file out/voids_lightcone.fits
#! file out/overdense_basins_lightcone.fits
#! file out/divergence_lightcone.fits
#! file out/galaxies_lightcone.fits
#! same out/displacement_mean_lightcone.fits lcpipeline/displacement_mean_lightcone.fits
#! same out/displacement_complete_lightcone.fits lcpipeline/displacement_complete_lightcone.fits
#! same out/voids_lightcone.fits lcpipeline/voids_lightcone.fits
#! same out/overdense_basins_lightcone.fits lcpipeline/overdense_basins_lightcone.fits
#! same out/divergence_lightcone.fits lcpipeline/divergence_lightcone.fits
#! same out/galaxies_lightcone.fits lcpipeline/galaxies_lightcone.fits
