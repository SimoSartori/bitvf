# A lightcone run on a complete displacement file, reusing a divergence file's grid: the files of the library calls, byte for byte, on 1 thread.

geometry = lightcone
verbosity = silent
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
output_dir = out
output_file = lightcone
displacement_file = @REFERENCE@/lcpipeline/displacement_complete_lightcone.fits
divergence_file = @REFERENCE@/lcpipeline/divergence_lightcone.fits
sigma = 0.5
printDiv = true
printGal = true
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 1
#! exit 0
#! listing out
#! file out/voids_lightcone.dat
#! file out/overdense_basins_lightcone.dat
#! file out/divergence_lightcone.dat
#! file out/divergence_lightcone.mps.dat
#! file out/galaxies_lightcone.dat
#! same out/voids_lightcone.dat lccomplete/voids_lightcone.dat
#! same out/overdense_basins_lightcone.dat lccomplete/overdense_basins_lightcone.dat
#! same out/divergence_lightcone.dat lccomplete/divergence_lightcone.dat
#! same out/divergence_lightcone.mps.dat lccomplete/divergence_lightcone.mps.dat
#! same out/galaxies_lightcone.dat lccomplete/galaxies_lightcone.dat
