# The keys of a pipeline in a lightcone run with displacement_file; the mask, the randoms and their reading stay.

geometry = lightcone
verbosity = silent
displacement_file = d.fits
output_dir = out
output_file = lightcone
tracer_file = 1
column_tracer = 0 1 2
id_column = 3
random_file = r.dat
column_random = 0 1 2
units = degrees
random_recons_mode = resample
delimiter = " "
comment = "#"
veto_mask_filename = m.fits
z_min = 1
z_max = 1
Omega_matter = 1
little_h = 1
w0 = 1
wa = 1
Nrec = 1
threshold = 1
seed = 1
mesh_cellsize = 1
bins = 1
reject_mask_crossings = true
max_unobserved_pixels_crossed = 1
perform_recons = true
save_zspace_voids = true
rsd_smoothing_scale = 1
rsd_weight_by_realizations = true
bias_file = b.dat
printDisplMean = true
printDisplComplete = true
printMps = true
printRecCat = true

