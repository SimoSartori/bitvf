# A lightcone run with the correction and the randoms of the second reconstruction given, ASCII: the files of the library calls, byte for byte.

geometry = lightcone
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers.dat
column_tracer = ra dec z
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
z_min = 0.26
z_max = 0.39
Omega_matter = 0.3
little_h = 0.7
Nrec = 2
bins = 1
cell_size = 0.5
output_dir = out
output_file = lightcone
seed = 3
perform_recons = true
random_recons_mode = external
random_file_recons = @TEST_DATA@/lightcone_randoms.dat
rsd_smoothing_scale = 20
bias_file = @TEST_DATA@/lightcone_bias.dat
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 1
#! exit 0
#! listing out
#! file out/voids_lightcone.dat
#! file out/overdense_basins_lightcone.dat
#! same out/voids_lightcone.dat lcexternal/voids_lightcone.dat
#! same out/overdense_basins_lightcone.dat lcexternal/overdense_basins_lightcone.dat
