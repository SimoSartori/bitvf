# The field of field.dat, comma-separated with % comments: the same files.

verbosity = silent
field_file = @TEST_DATA@/field_comma.csv
column_centre = x y z
column_value = value
column_weight = weight
delimiter = ","
comment = "%"
sigma_unit = coordinate
output_dir = out
output_file = box
printOverdense = true
printDiv = true

# Expected (tests/executable/run_case.cmake)
#! program bitvf-field
#! exit 0
#! listing out
#! file out/voids_box.dat
#! file out/overdense_basins_box.dat
#! file out/divergence_box.dat
#! same out/voids_box.dat field/voids_box.dat
#! same out/overdense_basins_box.dat field/overdense_basins_box.dat
#! same out/divergence_box.dat field/divergence_box.dat
