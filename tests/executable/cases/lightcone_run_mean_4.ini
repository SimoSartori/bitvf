# A lightcone run on a mean displacement file, with a cell and a smoothing of its own: the files of the library calls, byte for byte, on 4 threads.

geometry = lightcone
verbosity = silent
random_file = @TEST_DATA@/lightcone_randoms.dat
column_random = ra dec z
units = degrees
veto_mask_filename = @TEST_DATA@/lightcone_mask.fits
output_dir = out
output_file = lightcone
displacement_mean_file = @REFERENCE@/lcpipeline/displacement_mean_lightcone.fits
cell_size = 0.8
sigma = 3
sigma_unit = coordinate
output_format = fits
printDiv = true
printGal = true
printOverdense = true

# Expected (tests/executable/run_case.cmake)
#! threads 4
#! exit 0
#! listing out
#! file out/voids_lightcone.fits
#! file out/overdense_basins_lightcone.fits
#! file out/divergence_lightcone.fits
#! file out/galaxies_lightcone.fits
#! same out/voids_lightcone.fits lcmean/voids_lightcone.fits
#! same out/overdense_basins_lightcone.fits lcmean/overdense_basins_lightcone.fits
#! same out/divergence_lightcone.fits lcmean/divergence_lightcone.fits
#! same out/galaxies_lightcone.fits lcmean/galaxies_lightcone.fits
