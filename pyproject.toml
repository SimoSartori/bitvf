[build-system]
requires = ["scikit-build-core >= 0.11", "nanobind == 3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "bitvf"
version = "0.1.0"
description = "The Back-in-time Void Finder: voids from the optimal transport displacement field of a tracer catalogue"
requires-python = ">= 3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Simone Sartori" }]
dependencies = ["otswap >= 0.2.1, < 0.3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.11"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/bitvf"]
# the examples, their data and the documentation sources are for the source
# repository only
sdist.exclude = ["examples/", "docs/"]

[tool.scikit-build.cmake.define]
BITVF_BUILD_PYTHON = "ON"
BITVF_BUILD_TESTS = "OFF"
